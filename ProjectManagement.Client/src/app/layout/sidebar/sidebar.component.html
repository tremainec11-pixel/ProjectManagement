<aside class="sidebar">

  <!-- Header / Logo -->
  <div class="sidebar-header">

    <div class="logo">

      <div class="logo-icon">
        PM
      </div>

      <div class="logo-text">
        <span class="logo-title">ProjectFlow</span>
        <span class="logo-subtitle">Project Management</span>
      </div>

    </div>

  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <!-- Main Menu -->
    <div class="nav-section">

      <span class="nav-section-title">
        MAIN MENU
      </span>

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        class="nav-item"
      >
        <mat-icon>folder</mat-icon>
        <span>Projects</span>
      </a>

      <a
        routerLink="/tasks"
        routerLinkActive="active"
        class="nav-item"
      >
        <mat-icon>task_alt</mat-icon>
        <span>Tasks</span>
      </a>

    </div>

    <!-- Team -->
    <div class="nav-section">

      <span class="nav-section-title">
        TEAM
      </span>

      <a
        routerLink="/team"
        routerLinkActive="active"
        class="nav-item"
      >
        <mat-icon>groups</mat-icon>
        <span>Team</span>
      </a>

      <a
        routerLink="/members"
        routerLinkActive="active"
        class="nav-item"
      >
        <mat-icon>person</mat-icon>
        <span>Members</span>
      </a>

    </div>

    <!-- System -->
    <div class="nav-section">

      <span class="nav-section-title">
        SYSTEM
      </span>

      <a
        routerLink="/settings"
        routerLinkActive="active"
        class="nav-item"
      >
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
      </a>

    </div>

  </nav>

  <!-- User Profile -->
  <div class="sidebar-footer">

    <div class="user-profile">

      <div class="user-avatar">
        TC
      </div>

      <div class="user-info">

        <span class="user-name">
          Tremaine Charles
        </span>

        <span class="user-role">
          Administrator
        </span>

      </div>

      <mat-icon>
        more_vert
      </mat-icon>

    </div>

  </div>

</aside>
