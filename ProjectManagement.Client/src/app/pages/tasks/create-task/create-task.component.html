<div class="create-task-page">

  <div class="page-header">
    <div>
      <h1>Create Task</h1>
      <p>Create and assign a new task to a project.</p>
    </div>


<button
  type="button"
  class="back-button"
  (click)="cancel()">
  ← Back to Tasks
</button>


  </div>

  <div
    *ngIf="errorMessage"
    class="error-message">
    {{ errorMessage }}
  </div>

  <div
    *ngIf="isLoading"
    class="loading-message">
    Loading projects and users...
  </div>

  <form
    *ngIf="!isLoading"
    class="task-form"
    (ngSubmit)="createTask()">


<div class="form-section">

  <div class="section-header">
    <h2>Task Information</h2>
    <p>Enter the basic information for this task.</p>
  </div>

  <div class="form-group full-width">

    <label for="title">
      Task Title
    </label>

    <input
      id="title"
      name="title"
      type="text"
      [(ngModel)]="task.title"
      placeholder="Enter task title"
      required />

  </div>

  <div class="form-group full-width">

    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      name="description"
      [(ngModel)]="task.description"
      placeholder="Describe what needs to be done..."
      rows="5"
      required>
    </textarea>

  </div>

  <div class="form-grid">

    <div class="form-group">

      <label for="status">
        Status
      </label>

      <select
        id="status"
        name="status"
        [(ngModel)]="task.status">

        <option value="Todo">
          Todo
        </option>

        <option value="In Progress">
          In Progress
        </option>

        <option value="Done">
          Done
        </option>

      </select>

    </div>

    <div class="form-group">

      <label for="priority">
        Priority
      </label>

      <select
        id="priority"
        name="priority"
        [(ngModel)]="task.priority">

        <option value="Low">
          Low
        </option>

        <option value="Medium">
          Medium
        </option>

        <option value="High">
          High
        </option>

      </select>

    </div>

  </div>

</div>

<div class="form-section">

  <div class="section-header">
    <h2>Task Assignment</h2>
    <p>Connect this task to a project and assign it to a team member.</p>
  </div>

  <div class="form-grid">

    <div class="form-group">

      <label for="project">
        Project
      </label>

      <select
        id="project"
        name="projectId"
        [(ngModel)]="task.projectId"
        required>

        <option [ngValue]="0">
          Select a project
        </option>

        <option
          *ngFor="let project of projects"
          [ngValue]="project.id">

          {{ project.name }}

        </option>

      </select>

    </div>

    <div class="form-group">

      <label for="assignedTo">
        Assigned To
      </label>

      <select
        id="assignedTo"
        name="assignedToId"
        [(ngModel)]="task.assignedToId">

        <option [ngValue]="null">
          Unassigned
        </option>

        <option
          *ngFor="let user of users"
          [ngValue]="user.id">

          {{ user.firstName }} {{ user.lastName }}

        </option>

      </select>

    </div>

  </div>

  <div class="form-group">

    <label for="dueDate">
      Due Date
    </label>

    <input
      id="dueDate"
      name="dueDate"
      type="date"
      [(ngModel)]="task.dueDate" />

  </div>

</div>

<div class="form-actions">

  <button
    type="button"
    class="cancel-button"
    (click)="cancel()"
    [disabled]="isSaving">

    Cancel

  </button>

  <button
    type="submit"
    class="create-button"
    [disabled]="isSaving">

    <span *ngIf="!isSaving">
      Create Task
    </span>

    <span *ngIf="isSaving">
      Creating Task...
    </span>

  </button>

</div>


  </form>

</div>
